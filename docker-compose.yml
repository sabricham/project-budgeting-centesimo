# Centesimo — stack completo.
#
#   db   PostgreSQL, raggiungibile solo dalla rete interna: nessuna porta pubblicata.
#   api  FastAPI in HTTP sulla porta 8000, raggiungibile solo da `web`.
#   web  nginx: serve il sito e inoltra /api all'API. È l'unico servizio esposto.
#
# Il TLS non è qui dentro. Davanti a `web` ci sta Tailscale, che termina HTTPS con un
# certificato Let's Encrypt vero — niente più certificati self-signed da far accettare
# a mano. Vedi docs/DEPLOY.md.
#
# I segreti sono file montati in /run/secrets, mai valori in chiaro in questo file.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centesimo}
      POSTGRES_USER: ${POSTGRES_USER:-centesimo}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    secrets: [db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centesimo} -d ${POSTGRES_DB:-centesimo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-centesimo}
      DB_USER: ${POSTGRES_USER:-centesimo}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      BASE_CURRENCY: ${BASE_CURRENCY:-EUR}
      TZ: ${TZ:-Europe/Rome}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-8}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    secrets: [db_password, jwt_secret]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Solo questa porta esce dallo stack. Tailscale la pubblica su internet
      # (`tailscale funnel`), e resta comunque raggiungibile dalla rete di casa.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      # 127.0.0.1 e non `localhost`: dentro il container localhost risolve prima
      # su ::1, mentre nginx ascolta solo in IPv4 — il controllo fallirebbe con un
      # sito perfettamente funzionante. Passando da /health verifica anche l'API.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
