# nginx serve il sito e inoltra l'API: frontend e backend stanno sulla stessa origine.
#
# È la ragione per cui il frontend usa percorsi relativi `/api/v1/...` e non ha nessun
# indirizzo configurabile: funziona identico da localhost, dalla rete di casa e da
# internet via Tailscale, senza CORS e senza una variabile da ricordarsi di aggiornare.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Il vero TLS lo termina Tailscale davanti a noi; qui teniamo solo gli header
    # che proteggono il browser.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Senza questi il limitatore di tentativi sul login vedrebbe tutte le
        # richieste provenire dall'IP di nginx e bloccherebbe tutti insieme.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Comodi per diagnosticare da fuori senza aprire la Swagger.
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # I file con hash nel nome non cambiano mai: si possono tenere a lungo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Applicazione a pagina singola: ogni percorso sconosciuto torna a index.html,
    # altrimenti ricaricare /storico darebbe 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
