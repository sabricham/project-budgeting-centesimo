[pytest]
testpaths = tests
# Senza questo, `pytest` lanciato dalla root del progetto non trova il package
# `app`: con l'import mode di default pytest mette in sys.path la cartella dei
# test, non la root. (`python -m pytest` funzionerebbe, ma il comando
# documentato e' `docker compose exec api pytest`.)
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
