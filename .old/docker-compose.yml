# Centesimo — stack locale (§3.3 dell'architettura).
#
#   db  : PostgreSQL 16, raggiungibile SOLO dalla rete `internal` (nessuna porta pubblicata).
#   api : FastAPI su HTTPS 8443, unico servizio esposto verso l'host.
#
# I segreti sono file montati in /run/secrets (docker secrets in modalità compose),
# mai variabili d'ambiente in chiaro nel compose.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money}
      POSTGRES_USER: ${POSTGRES_USER:-money_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    secrets: [db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money_app} -d ${POSTGRES_DB:-money}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-money}
      DB_USER: ${POSTGRES_USER:-money_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MARKET_DATA_API_KEY_FILE: /run/secrets/market_data_api_key
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-twelvedata}
      BASE_CURRENCY: ${BASE_CURRENCY:-EUR}
      TZ: ${TZ:-Europe/Rome}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Nomi aggiuntivi nel certificato self-signed: servono quando l'API non è
      # su localhost ma su una macchina raggiunta per IP/hostname (vedi docs/DEPLOY.md).
      CERT_CN: ${CERT_CN:-localhost}
      CERT_EXTRA_SAN: ${CERT_EXTRA_SAN:-}
    ports:
      - "8443:8443"
    volumes:
      # Il certificato self-signed vive qui: serve anche al client Windows,
      # che lo "pinna" invece di disabilitare la verifica TLS (§1.1).
      - ./server/certs:/app/certs
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, external]
    secrets: [db_password, jwt_secret, market_data_api_key]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;ctx=ssl._create_unverified_context();urllib.request.urlopen('https://localhost:8443/health',context=ctx)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  internal:
    internal: true   # nessun accesso a internet/host: solo db <-> api
  external:

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  market_data_api_key:
    file: ./secrets/market_data_api_key.txt
